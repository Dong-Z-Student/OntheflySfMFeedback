#路径设置可以采用绝对路径或者相对路径，正斜杠反斜杠均可，推荐采用绝对路径+反斜杠
[SfM]
#使用自定义的焦距参数
useFocalLength=false
useFactor=0.704
#添加自定义的相机模型，可选：SIMPLE_PINHOLE，PINHOLE，SIMPLE_RADIAL，RADIAL
cameraModel=SIMPLE_RADIAL

[Pipeline]
#是否自动重建文件夹中已有的图片，设置为false则只重建移动端上传的图片
AutoRunImages=true
#自动导出模型，暂时无效，请在代码中使用GaussianSplatting_Output宏进行控制
AutoExportModel=false
#开始初始化的影像库大小
InitialImagesNum=50

[Python]
#定义Python环境目录，选择python.exe文件所在的根目录即可
PythonHome=C:\Users\WTG\env\Python

#定义Python代码存储目录
PythonWorkspace=C:\Users\WTG\code\OntheFlySfM\scripts\pyscripts

#定义深度学习权重文件存储目录
GlobalFeatureModel=C:\Users\WTG\code\OntheFlySfM\scripts\pyscripts

[Feedback]
#注册影像数达到一定数量时开始构建Mesh
StartCreateMesh = 4000
#间隔注册影像数更新Mesh
Step = 10

[Test]
ModelFolder=D:\DATASET\whu_models
Start=80
Step=10
End=110